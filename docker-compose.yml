# Запуск всего проекта: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # для сервисов
      - "15672:15672" # веб-панель: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      args:
        SERVICE: api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://library:library@postgres:5432/library?sslmode=disable
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      OVERDUE_INTERVAL: 15s
      OVERDUE_WORKERS: "3"
      REPORTS_DIR: /app/reports
      SEED_FILE: /app/data/books.csv
    ports:
      - "8080:8080"
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  notifier:
    build:
      context: .
      args:
        SERVICE: notifier
    environment:
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      NOTIFY_LOG_FILE: /app/logs/notifications.log
    volumes:
      - ./logs:/app/logs
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
